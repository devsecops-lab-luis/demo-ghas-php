rules:
  - id: php-sql-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: "Inyección SQL: entrada del usuario concatenada en una consulta. Usa sentencias preparadas (prepare/bind_param)."
    metadata: {cwe: "CWE-89: SQL Injection", category: security, owasp: "A03:2021 - Injection"}
    pattern-sources:
      - pattern-either: [{pattern: $_GET}, {pattern: $_POST}, {pattern: $_REQUEST}, {pattern: $_COOKIE}]
    pattern-sinks:
      - pattern-either:
          - pattern: $CONN->query(...)
          - pattern: mysqli_query($C, ...)
  - id: php-xss-reflejado
    mode: taint
    languages: [php]
    severity: ERROR
    message: "XSS reflejado: se imprime entrada del usuario sin escapar. Usa htmlspecialchars()."
    metadata: {cwe: "CWE-79: Cross-site Scripting", category: security, owasp: "A03:2021 - Injection"}
    pattern-sources:
      - pattern-either: [{pattern: $_GET}, {pattern: $_POST}, {pattern: $_REQUEST}]
    pattern-sinks:
      - pattern: echo ...;
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
  - id: php-command-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: "Inyección de comandos: entrada del usuario llega a una función que ejecuta comandos del sistema."
    metadata: {cwe: "CWE-78: OS Command Injection", category: security, owasp: "A03:2021 - Injection"}
    pattern-sources:
      - pattern-either: [{pattern: $_GET}, {pattern: $_POST}, {pattern: $_REQUEST}]
    pattern-sinks:
      - pattern-either: [{pattern: shell_exec(...)}, {pattern: system(...)}, {pattern: exec(...)}, {pattern: passthru(...)}]
    pattern-sanitizers:
      - pattern-either: [{pattern: escapeshellarg(...)}, {pattern: escapeshellcmd(...)}]
  - id: php-path-traversal
    mode: taint
    languages: [php]
    severity: ERROR
    message: "Path traversal / inclusión de archivos con entrada del usuario."
    metadata: {cwe: "CWE-22: Path Traversal", category: security, owasp: "A01:2021 - Broken Access Control"}
    pattern-sources:
      - pattern-either: [{pattern: $_GET}, {pattern: $_POST}, {pattern: $_REQUEST}]
    pattern-sinks:
      - pattern-either: [{pattern: readfile(...)}, {pattern: file_get_contents(...)}, {pattern: include(...)}, {pattern: require(...)}]
  - id: php-deserializacion-insegura
    mode: taint
    languages: [php]
    severity: ERROR
    message: "Deserialización insegura de datos controlados por el usuario. Usa json_decode()."
    metadata: {cwe: "CWE-502: Deserialization of Untrusted Data", category: security, owasp: "A08:2021 - Software and Data Integrity Failures"}
    pattern-sources:
      - pattern-either: [{pattern: $_GET}, {pattern: $_POST}, {pattern: $_COOKIE}, {pattern: $_REQUEST}]
    pattern-sinks:
      - pattern: unserialize(...)
  - id: php-eval-inyeccion-codigo
    mode: taint
    languages: [php]
    severity: ERROR
    message: "Inyección de código: entrada del usuario llega a eval()."
    metadata: {cwe: "CWE-95: Eval Injection", category: security, owasp: "A03:2021 - Injection"}
    pattern-sources:
      - pattern-either: [{pattern: $_GET}, {pattern: $_POST}, {pattern: $_REQUEST}]
    pattern-sinks:
      - pattern: eval(...)
  - id: php-hash-debil-md5
    languages: [php]
    severity: WARNING
    message: "MD5 es inseguro para contraseñas. Usa password_hash()."
    metadata: {cwe: "CWE-328: Use of Weak Hash", category: security, owasp: "A02:2021 - Cryptographic Failures"}
    pattern-either: [{pattern: md5(...)}, {pattern: sha1(...)}]
  - id: php-credenciales-hardcodeadas
    languages: [php]
    severity: WARNING
    message: "Credencial hardcodeada en el código fuente. Usa variables de entorno o un gestor de secretos."
    metadata: {cwe: "CWE-798: Hard-coded Credentials", category: security, owasp: "A07:2021 - Identification and Authentication Failures"}
    patterns:
      - pattern: define("$K", "$V");
      - metavariable-regex: {metavariable: $K, regex: (?i).*(pass|secret|token|key).*}
